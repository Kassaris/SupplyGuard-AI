[project]
name = "supplyguard-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kassaris", email = "nickos.kassaris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "chainlit>=2.12.0",
    "langchain-chroma>=1.2.0",
    "langchain-core>=1.8.4",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.24",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
supplyguard-ai = "supplyguard_ai:main"

[tool.pytest.ini_options]
# Where pytest looks for tests, and which folders it adds to the import path:
# src/ for the application package, tests/ for the shared test helpers.
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Integration tests need the Docker services; run them with `uv run pytest -m integration`.
markers = ["integration: needs the Docker services with the data loaded"]
addopts = "-m 'not integration'"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
