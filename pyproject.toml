[project]
name = "supplyguard-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kassaris", email = "nickos.kassaris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
supplyguard-ai = "supplyguard_ai:main"

[tool.pytest.ini_options]
# Where pytest looks for tests, and which folders it adds to the import path:
# src/ for the application package, tests/ for the shared test helpers.
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
