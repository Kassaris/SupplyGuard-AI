# docker compose up -d --build  ->  http://localhost:8000

x-app: &app
  build: .
  image: supplyguard-ai:latest
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NEO4J_URI: bolt://neo4j:7687
    CHROMA_HOST: chromadb
    CHROMA_PORT: "8000"
    SUPPORT_DATA_DIR: /code/support-data
    PROCUREMENT_MCP_URL: http://procurement-mcp:8101/mcp
    EXTERNAL_MCP_URL: http://external-mcp:8102/mcp
    EXTERNAL_INFO_URL: http://external-info:8099
    SANDBOX_URL: http://sandbox:8200

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_directories_import: /support-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./support-data/graph:/support-graph:ro
    healthcheck:
      test: cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  # init jobs
  neo4j-seed:
    image: neo4j:5.26
    entrypoint: cypher-shell -a bolt://neo4j:7687 -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} -f /load.cypher
    volumes:
      - ./support-data/graph/load.cypher:/load.cypher:ro
    depends_on:
      neo4j:
        condition: service_healthy

  data-load:
    <<: *app
    command: sh -c "python -m supplyguard_ai.ingestion.load_structured && python -m supplyguard_ai.ingestion.seed_users"
    depends_on:
      postgres:
        condition: service_healthy

  # runs once, delete the ingest_state volume to re-embed
  doc-ingest:
    <<: *app
    command:
      - sh
      - -c
      - |
        test -f /state/documents.done && exit 0
        n=0
        until python -m supplyguard_ai.ingestion.ingest_documents; do
          n=$$((n+1)); [ $$n -ge 10 ] && exit 1
          sleep 5
        done
        touch /state/documents.done
    volumes:
      - ingest_state:/state
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  external-info:
    image: python:3.12.10-slim
    user: "65534:65534"
    working_dir: /service
    command: python external_info_service.py 8099
    volumes:
      - ./support-data/external_service:/service:ro

  external-mcp:
    <<: *app
    command: python -m supplyguard_ai.mcp_servers.external_server
    ports:
      - "127.0.0.1:8102:8102"
    depends_on:
      - external-info

  procurement-mcp:
    <<: *app
    command: python -m supplyguard_ai.mcp_servers.procurement_server
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      data-load:
        condition: service_completed_successfully

  # code sandbox for the investigator agent (no internet)
  sandbox:
    image: python:3.12.10-slim
    user: "65534:65534"
    command: python /sandbox/server.py
    volumes:
      - ./src/supplyguard_ai/sandbox/server.py:/sandbox/server.py:ro
    networks: [sandbox_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0

  app:
    <<: *app
    ports:
      - "8000:8000"
    networks: [default, sandbox_net]
    depends_on:
      neo4j-seed:
        condition: service_completed_successfully
      data-load:
        condition: service_completed_successfully
      doc-ingest:
        condition: service_completed_successfully
      procurement-mcp:
        condition: service_started
      external-mcp:
        condition: service_started
      sandbox:
        condition: service_started

  # docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  sandbox_net:
    internal: true

volumes:
  postgres_data:
  neo4j_data:
  chroma_data:
  ingest_state:
